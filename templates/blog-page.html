{% extends "base.html" %}

{% block content %}
<section class="card">
  <article class="card-inner prose post">

    <h1>{{ page.title }}</h1>

    {% if page.description %}
      <p class="subtitle post-description">{{ page.description }}</p>
    {% endif %}

    {% if page.date %}
      <div class="tiny mono" style="margin-bottom:16px;">
        {{ page.date | date(format="%b %d, %Y") }}
      </div>
    {% endif %}

    {{ page.content | safe }}

  </article>
</section>
{% endblock content %}
